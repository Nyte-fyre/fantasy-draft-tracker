<body>

<script>
const DRAFT_STORAGE_KEY = "ff-2026-draft-state";
const SLEEPER_DRAFT_ID_KEY = "ff-2026-sleeper-draft-id";
const DEFAULT_SLEEPER_DRAFT_ID = "1378473537542565888";
const SEASON_CACHE_KEY = "ff-2026-season-cache";
const PLAYERS_CACHE_KEY = "ff-2026-sleeper-players-cache";
const PLAYERS_CACHE_TS_KEY = "ff-2026-sleeper-players-cache-ts";

function getDraftId(){
  return localStorage.getItem(SLEEPER_DRAFT_ID_KEY) || DEFAULT_SLEEPER_DRAFT_ID;
}

const LINEUP_SLOTS = [
  {key:"qbId",   label:"QB",   positions:["QB"]},
  {key:"rb1Id",  label:"RB",   positions:["RB"]},
  {key:"rb2Id",  label:"RB",   positions:["RB"]},
  {key:"wr1Id",  label:"WR",   positions:["WR"]},
  {key:"wr2Id",  label:"WR",   positions:["WR"]},
  {key:"teId",   label:"TE",   positions:["TE"]},
  {key:"flexId", label:"FLEX", positions:["RB","WR","TE"]},
  {key:"kId",    label:"K",    positions:["K"]},
  {key:"dstId",  label:"DST",  positions:["DST"]},
];

function loadDraftSharedData(){
  try{
    const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
    if(!raw) return null;
    const state = JSON.parse(raw);
    const players = (state.pts||[]).map(p=>({name:p.name, pos:p.pos, team:p.team, pts:p.pts, adp:p.adp||999, ownerId:null}));
    const byName = {};
    players.forEach(p=>byName[p.name]=p);
    (state.owners||[]).forEach(o=>{ if(byName[o.name]) byName[o.name].ownerId = o.ownerId; });
    const teams = (state.teams||[]).map(t=>({...t}));
    return {players, teams};
  }catch(e){ return null; }
}

function computeLineup(team, players){
  const roster = players.filter(p=>p.ownerId===team.id);
  const claimedNames = new Set();
  const claims = new Array(LINEUP_SLOTS.length).fill(null);
  LINEUP_SLOTS.forEach((def,i)=>{
    const chosenName = team[def.key];
    if(!chosenName || claimedNames.has(chosenName)) return;
    const candidate = roster.find(p=>p.name===chosenName && def.positions.includes(p.pos));
    if(candidate){ claims[i] = candidate; claimedNames.add(candidate.name); }
  });
  LINEUP_SLOTS.forEach((def,i)=>{
    if(claims[i]) return;
    const best = roster.filter(p=>def.positions.includes(p.pos) && !claimedNames.has(p.name))
                        .sort((a,b)=>b.pts-a.pts)[0];
    if(best){ claims[i] = best; claimedNames.add(best.name); }
  });
  const slots = LINEUP_SLOTS.map((def,i)=>({...def, player:claims[i]}));
  const bench = roster.filter(p=>!claimedNames.has(p.name));
  const starterTotal = slots.reduce((s,slot)=>s+(slot.player?slot.player.pts:0),0);
  return {slots, bench, starterTotal};
}

async function fetchAllSleeperPlayers(){
  const cachedTs = localStorage.getItem(PLAYERS_CACHE_TS_KEY);
  if(cachedTs && (Date.now() - parseInt(cachedTs)) < 20*60*60*1000){
    try{ return JSON.parse(localStorage.getItem(PLAYERS_CACHE_KEY)); }catch(e){}
  }
  const res = await fetch("https://api.sleeper.app/v1/players/nfl");
  if(!res.ok) throw new Error("players fetch failed");
  const data = await res.json();
  try{
    localStorage.setItem(PLAYERS_CACHE_KEY, JSON.stringify(data));
    localStorage.setItem(PLAYERS_CACHE_TS_KEY, String(Date.now()));
  }catch(e){}
  return data;
}

function loadSeasonCache(){
  try{ return JSON.parse(localStorage.getItem(SEASON_CACHE_KEY)); }catch(e){ return null; }
}
function saveSeasonCache(data){
  try{ localStorage.setItem(SEASON_CACHE_KEY, JSON.stringify(data)); }catch(e){}
}

async function syncSeason(){
  const btn = document.getElementById('syncBtn');
  const statusEl = document.getElementById('syncStatus');
  btn.disabled = true;
  statusEl.textContent = "Fetching league info...";
  try{
    const draftId = getDraftId();
    const draftRes = await fetch(`https://api.sleeper.app/v1/draft/${draftId}`);
    if(!draftRes.ok) throw new Error("Could not load draft/league info");
    const draftInfo = await draftRes.json();
    const leagueId = draftInfo.league_id;
    const slotToRoster = draftInfo.slot_to_roster_id || {};
    if(!leagueId) throw new Error("No league_id found for this draft");

    // roster_id -> team id (1-10), matching how the draft tracker assigns team identity by draft slot
    const teamIdByRosterId = {};
    Object.entries(slotToRoster).forEach(([slot, rosterId])=>{ teamIdByRosterId[rosterId] = parseInt(slot); });

    statusEl.textContent = "Loading rosters & users...";
    const [rostersRes, usersRes, stateRes] = await Promise.all([
      fetch(`https://api.sleeper.app/v1/league/${leagueId}/rosters`),
      fetch(`https://api.sleeper.app/v1/league/${leagueId}/users`),
      fetch(`https://api.sleeper.app/v1/state/nfl`),
    ]);
    const rosters = rostersRes.ok ? await rostersRes.json() : [];
    const users = usersRes.ok ? await usersRes.json() : [];
    const nflState = stateRes.ok ? await stateRes.json() : {week:1, season_type:"regular"};
    // Sleeper's /state/nfl reports a week number even during preseason/offseason — that
    // number does NOT correspond to real fantasy matchups, so treat anything other than
    // "regular" season_type as "the season hasn't actually started yet."
    const seasonStarted = nflState.season_type === "regular";
    const currentWeek = seasonStarted ? Math.max(1, nflState.week || 1) : 0;

    if(!seasonStarted){
      statusEl.textContent = `Regular season hasn't started yet (Sleeper reports "${nflState.season_type}") — no matchups to sync until Week 1 kicks off.`;
      btn.disabled = false;
      return;
    }

    const ownerIdToName = {};
    users.forEach(u=>{ ownerIdToName[u.user_id] = (u.metadata && u.metadata.team_name) || u.display_name; });

    const rosterMeta = {}; // roster_id -> {teamId, name, playerIds[]}
    rosters.forEach(r=>{
      const teamId = teamIdByRosterId[r.roster_id];
      rosterMeta[r.roster_id] = {
        teamId,
        name: ownerIdToName[r.owner_id] || ("Roster "+r.roster_id),
        playerIds: r.players || [],
      };
    });

    statusEl.textContent = "Loading player database...";
    const allPlayers = await fetchAllSleeperPlayers();
    const nameOf = pid => {
      const p = allPlayers[pid];
      if(!p) return pid; // fall back to raw id if unknown (e.g. free agent DST codes)
      return p.full_name || (p.first_name && p.last_name ? p.first_name+" "+p.last_name : pid);
    };

    // Reuse whatever per-week data we already fetched on a previous sync. A "completed"
    // week (anything before the current in-progress one) never changes once it's final,
    // so it only ever needs to be fetched once. Only the current week — and any week
    // number we haven't seen before — actually needs a fresh network call.
    const prevCache = loadSeasonCache() || {};
    const weekMatchups = prevCache.weekMatchups || {};
    const weekTransactions = prevCache.weekTransactions || {};
    let weeksFetched = 0, weeksReused = 0;

    for(let week=1; week<=currentWeek; week++){
      const isCompleted = week < currentWeek;
      const haveIt = weekMatchups[week] !== undefined && weekTransactions[week] !== undefined;
      if(isCompleted && haveIt){ weeksReused++; continue; }

      statusEl.textContent = `Loading week ${week} of ${currentWeek}...`;
      weeksFetched++;
      const [mRes, tRes] = await Promise.all([
        fetch(`https://api.sleeper.app/v1/league/${leagueId}/matchups/${week}`),
        fetch(`https://api.sleeper.app/v1/league/${leagueId}/transactions/${week}`),
      ]);
      weekMatchups[week] = mRes.ok ? await mRes.json() : [];
      const txns = tRes.ok ? await tRes.json() : [];
      txns.forEach(t=>t._week = week);
      weekTransactions[week] = txns;
    }

    statusEl.textContent = "Crunching standings...";
    const standings = {}; // teamId -> {w,l,t,pf}
    Object.values(rosterMeta).forEach(rm=>{ if(rm.teamId) standings[rm.teamId] = {w:0,l:0,t:0,pf:0,name:rm.name}; });

    for(let week=1; week<=currentWeek; week++){
      const matchups = weekMatchups[week] || [];
      const byMatchupId = {};
      matchups.forEach(m=>{
        if(m.matchup_id==null) return;
        (byMatchupId[m.matchup_id] = byMatchupId[m.matchup_id]||[]).push(m);
      });
      Object.values(byMatchupId).forEach(pair=>{
        pair.forEach(m=>{
          const rm = rosterMeta[m.roster_id];
          if(!rm || !rm.teamId || !standings[rm.teamId]) return;
          standings[rm.teamId].pf += m.points || 0;
        });
        if(pair.length===2 && week < currentWeek){
          // only score W/L for completed weeks (not the in-progress current week)
          const [a,b] = pair;
          const rmA = rosterMeta[a.roster_id], rmB = rosterMeta[b.roster_id];
          if(rmA && rmA.teamId && standings[rmA.teamId] && rmB && rmB.teamId && standings[rmB.teamId]){
            if((a.points||0) > (b.points||0)){ standings[rmA.teamId].w++; standings[rmB.teamId].l++; }
            else if((a.points||0) < (b.points||0)){ standings[rmB.teamId].w++; standings[rmA.teamId].l++; }
            else { standings[rmA.teamId].t++; standings[rmB.teamId].t++; }
          }
        }
      });
    }

    let allTxns = [];
    for(let week=1; week<=currentWeek; week++){
      allTxns = allTxns.concat(weekTransactions[week] || []);
    }
    allTxns.sort((a,b)=> (b.status_updated||0) - (a.status_updated||0));

    // waiver wire = every player in Sleeper's DB not currently on any roster
    const rosteredIds = new Set();
    rosters.forEach(r=>(r.players||[]).forEach(pid=>rosteredIds.add(pid)));
    const availablePlayers = Object.values(allPlayers)
      .filter(p=>p && p.player_id && !rosteredIds.has(p.player_id) && p.position && ["QB","RB","WR","TE","K","DEF"].includes(p.position) && p.team)
      .map(p=>({id:p.player_id, name:p.full_name || (p.first_name+" "+p.last_name), pos:p.position, team:p.team, rank:p.search_rank||9999}))
      .sort((a,b)=>a.rank-b.rank)
      .slice(0, 300); // cap the list to a manageable size, sorted by relevance

    const seasonData = {
      currentWeek,
      weekMatchups,       // cached raw per-week data, reused on future syncs
      weekTransactions,   // cached raw per-week data, reused on future syncs
      rosterIdToTeamId: teamIdByRosterId, // lets Power Rankings recompute at render time, no extra fetches
      standings: Object.entries(standings).map(([teamId,s])=>({teamId:parseInt(teamId), ...s})),
      transactions: allTxns.slice(0, 100).map(t=>({
        id: t.transaction_id || (t.type+"_"+t.status_updated),
        type: t.type, week: t._week, status_updated: t.status_updated,
        rosterNames: (t.roster_ids||[]).map(rid=>(rosterMeta[rid]&&rosterMeta[rid].name)||("Roster "+rid)),
        adds: t.adds ? Object.entries(t.adds).map(([pid,rid])=>({player:nameOf(pid), team:(rosterMeta[rid]&&rosterMeta[rid].name)||("Roster "+rid)})) : [],
        drops: t.drops ? Object.entries(t.drops).map(([pid,rid])=>({player:nameOf(pid), team:(rosterMeta[rid]&&rosterMeta[rid].name)||("Roster "+rid)})) : [],
      })),
      availablePlayers,
      syncedAt: Date.now(),
    };

    // mark transactions that weren't present last sync, so new activity stands out
    const prevTxnIds = new Set((prevCache.transactions||[]).map(t=>t.id));
    seasonData.transactions.forEach(t=>{ t.isNew = prevCache.transactions ? !prevTxnIds.has(t.id) : false; });

    saveSeasonCache(seasonData);
    statusEl.textContent = weeksReused>0
      ? `Synced \u2014 ${weeksFetched} week(s) fetched, ${weeksReused} reused from cache`
      : `Synced through week ${currentWeek}`;
    render();
  }catch(e){
    statusEl.textContent = "Sync failed: " + e.message;
    console.error(e);
  }finally{
    btn.disabled = false;
    setTimeout(()=>{ if(statusEl.textContent.startsWith("Synced")) statusEl.textContent=""; }, 4000);
  }
}

function txnBadgeClass(type){
  if(type==="trade") return "tradebadge";
  if(type==="waiver") return "waiverbadge";
  return "fabadge";
}

// ---------- Power Rankings ----------
// Blends three signals into one score per team: record (40%), points-for relative
// to the league (40%), and recent 3-week form vs their own season average (20%).
// Record alone gets skewed by schedule luck; points-for is a steadier read on who's
// actually good; the recent-form nudge lets a hot or cold streak move a team before
// their record has caught up to reality.
const POWER_HISTORY_KEY = "ff-2026-power-history";
function loadPowerHistory(){ try{ return JSON.parse(localStorage.getItem(POWER_HISTORY_KEY))||{}; }catch(e){ return {}; } }
function savePowerHistory(h){ try{ localStorage.setItem(POWER_HISTORY_KEY, JSON.stringify(h)); }catch(e){} }

function computePowerRankings(seasonData, draftData){
  const teamById = {};
  draftData.teams.forEach(t=>teamById[t.id]=t);

  // build each team's week-by-week point totals from the already-cached raw matchup data
  const weeklyPts = {}; // teamId -> [pts week1, pts week2, ...] (completed weeks only)
  const completedWeeks = Math.max(0, seasonData.currentWeek - 1);
  for(let w=1; w<=completedWeeks; w++){
    (seasonData.weekMatchups[w]||[]).forEach(m=>{
      const teamId = seasonData.rosterIdToTeamId[m.roster_id];
      if(!teamId) return;
      (weeklyPts[teamId] = weeklyPts[teamId]||[]).push(m.points||0);
    });
  }

  if(completedWeeks < 1) return {ready:false};

  const standingsByTeam = {};
  seasonData.standings.forEach(s=>standingsByTeam[s.teamId]=s);

  const rows = Object.keys(weeklyPts).map(teamIdStr=>{
    const teamId = parseInt(teamIdStr);
    const pts = weeklyPts[teamId];
    const games = pts.length;
    const totalPF = pts.reduce((a,b)=>a+b,0);
    const seasonAvg = totalPF / games;
    const recentPts = pts.slice(-3); // last up-to-3 completed weeks
    const recentAvg = recentPts.reduce((a,b)=>a+b,0) / recentPts.length;
    const s = standingsByTeam[teamId] || {w:0,l:0,t:0};
    const winPct = (s.w + s.t*0.5) / Math.max(1, s.w+s.l+s.t);
    return {teamId, teamObj: teamById[teamId], totalPF, seasonAvg, recentAvg, winPct, games,
      record: `${s.w}-${s.l}${s.t?`-${s.t}`:""}`};
  }).filter(r=>r.teamObj);

  // convert PF and momentum into 0-100 percentile ranks across the league (robust with small N)
  const n = rows.length;
  function percentileRank(arr, keyFn){
    const sorted = [...arr].sort((a,b)=>keyFn(b)-keyFn(a)); // best first
    const scoreOf = {};
    sorted.forEach((r,i)=>{ scoreOf[r.teamId] = n>1 ? Math.round(((n-1-i)/(n-1))*100) : 100; });
    return scoreOf;
  }
  const pfScore = percentileRank(rows, r=>r.totalPF);
  const momentumScore = percentileRank(rows, r=>r.recentAvg - r.seasonAvg);

  rows.forEach(r=>{
    r.winPctScore = Math.round(r.winPct*100);
    r.pfPercentile = pfScore[r.teamId];
    r.momentumPercentile = momentumScore[r.teamId];
    r.powerScore = Math.round(0.4*r.winPctScore + 0.4*r.pfPercentile + 0.2*r.momentumPercentile);
  });
  rows.sort((a,b)=>b.powerScore - a.powerScore);

  // rank-based blurb: compare how a team's record rank compares to their scoring rank
  const byWinRank = [...rows].sort((a,b)=>b.winPct-a.winPct);
  const byPfRank = [...rows].sort((a,b)=>b.totalPF-a.totalPF);
  rows.forEach(r=>{
    const winRank = byWinRank.findIndex(x=>x.teamId===r.teamId)+1;
    const pfRank = byPfRank.findIndex(x=>x.teamId===r.teamId)+1;
    const momentumDelta = r.recentAvg - r.seasonAvg;
    if(winRank <= pfRank - 2) r.blurb = "Winning more than the scoring suggests — living dangerously.";
    else if(pfRank <= winRank - 2) r.blurb = "Outscoring their record — better than the standings show.";
    else if(momentumDelta > 8) r.blurb = "Trending up over the last few weeks.";
    else if(momentumDelta < -8) r.blurb = "Cooling off lately.";
    else r.blurb = "Playing right around their true level.";
  });

  // movement arrows vs the last time this many weeks were completed
  const history = loadPowerHistory();
  const prevOrder = history[completedWeeks-1] || null;
  rows.forEach((r,i)=>{
    if(!prevOrder){ r.movement = null; return; }
    const prevIdx = prevOrder.indexOf(r.teamId);
    if(prevIdx===-1){ r.movement = null; return; }
    r.movement = prevIdx - i; // positive = moved up
  });
  history[completedWeeks] = rows.map(r=>r.teamId);
  savePowerHistory(history);

  return {ready:true, rows, completedWeeks};
}

function movementArrow(m){
  if(m===null || m===undefined) return '<span style="color:var(--sub);">–</span>';
  if(m>0) return `<span style="color:var(--accent);">▲${m}</span>`;
  if(m<0) return `<span style="color:var(--danger);">▼${Math.abs(m)}</span>`;
  return '<span style="color:var(--sub);">–</span>';
}

let powerDetailsShown = false;

function renderPowerRankingsPanel(seasonData, draftData){
  const pr = computePowerRankings(seasonData, draftData);
  if(!pr.ready){
    return `<div class="panel">
      <h2>Power Rankings</h2>
      <div class="empty-state" style="padding:20px;">Needs at least 1 completed week to compute.</div>
    </div>`;
  }
  const rows = pr.rows.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td style="width:20px;">${movementArrow(r.movement)}</td>
      <td>${r.teamObj.name}</td>
      <td style="color:var(--gold);font-weight:700;">${r.powerScore}</td>
      ${powerDetailsShown ? `
        <td style="color:var(--sub);font-size:12px;">${r.record}</td>
        <td style="color:var(--sub);font-size:12px;">${r.totalPF.toFixed(1)}</td>
        <td style="color:var(--sub);font-size:12px;">${r.recentAvg.toFixed(1)}</td>
      ` : ""}
    </tr>
    ${powerDetailsShown ? `<tr><td></td><td></td><td colspan="${5}" style="color:var(--sub);font-size:12px;font-style:italic;padding-top:0;">${r.blurb}</td></tr>` : ""}
  `).join("");

  return `<div class="panel">
    <h2>Power Rankings <span style="color:var(--sub);font-weight:400;font-size:11px;">(through week ${pr.completedWeeks}) &mdash; blends record, points scored, and recent form</span></h2>
    <div class="controls" style="margin-bottom:10px;">
      <button id="powerToggleBtn" style="background:var(--panel2);border:1px solid var(--gold-dim);color:var(--gold);">
        ${powerDetailsShown ? "Hide details" : "Show details"}
      </button>
    </div>
    <table>
      <thead><tr>
        <th>#</th><th></th><th>Team</th><th>Score</th>
        ${powerDetailsShown ? `<th>Record</th><th>Pts For</th><th>Last 3 Avg</th>` : ""}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function render(){
  const draftData = loadDraftSharedData();
  const seasonData = loadSeasonCache();
  const el = document.getElementById('content');

  if(!draftData || !draftData.teams.length){
    el.innerHTML = `<div class="panel"><div class="empty-state">
      No draft data found yet in this browser.<br>
      Open the <a href="draft.html">Draft Tracker</a> first, sync it, then come back here.
    </div></div>`;
    return;
  }

  if(!seasonData){
    el.innerHTML = `<div class="panel"><div class="empty-state">
      Click <b>Sync from Sleeper</b> above to pull in standings, waiver wire, and trade history.
    </div></div>`;
  } else {
    const previewBanner = seasonData.isPreview
      ? `<div class="panel" style="border-color:var(--gold);background:#3a2f0f;">
          <b style="color:var(--gold);">PREVIEW MODE</b> — everything below is fake sample data for testing how the page looks and behaves. Click <b>Reset Sync Data</b> before your real season starts.
        </div>`
      : "";
    // match season standings (keyed by teamId 1-10) to the draft tracker's team names/nicknames
    const teamById = {};
    draftData.teams.forEach(t=>teamById[t.id]=t);
    const standingsSorted = seasonData.standings
      .map(s=>({...s, teamObj: teamById[s.teamId]}))
      .filter(s=>s.teamObj)
      .sort((a,b)=> b.w-a.w || b.pf-a.pf);

    const standingsRows = standingsSorted.map((s,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${s.teamObj.name}${s.teamObj.nickname?` <span style="color:var(--sub);font-style:italic;font-size:11px;">"${s.teamObj.nickname}"</span>`:""}</td>
        <td>${s.w}-${s.l}${s.t?`-${s.t}`:""}</td>
        <td>${s.pf.toFixed(1)}</td>
      </tr>`).join("");

    const txnRows = seasonData.transactions.map(t=>{
      const moves = [
        ...t.adds.map(a=>`<div>+ ${a.player} <span style="color:var(--sub)">&rarr; ${a.team}</span></div>`),
        ...t.drops.map(d=>`<div style="color:var(--danger)">- ${d.player} <span style="color:var(--sub)">&larr; ${d.team}</span></div>`),
      ].join("");
      return `<tr>
        <td><span class="txnbadge ${txnBadgeClass(t.type)}">${t.type}</span>${t.isNew?'<span class="newbadge">NEW</span>':''}</td>
        <td>Wk ${t.week}</td>
        <td>${moves || '<span style="color:var(--sub)">-</span>'}</td>
      </tr>`;
    }).join("");

    const waiverRows = seasonData.availablePlayers.slice(0,60).map(p=>`
      <tr>
        <td><span class="postag ${p.pos}">${p.pos}</span></td>
        <td>${p.name}</td>
        <td>${p.team}</td>
      </tr>`).join("");

    el.innerHTML = `
      ${previewBanner}
      <div class="panel">
        <h2>Standings <span style="color:var(--sub);font-weight:400;font-size:11px;">(through week ${seasonData.currentWeek - 1 || 1})</span></h2>
        <table>
          <thead><tr><th>#</th><th>Team</th><th>Record</th><th>Points For</th></tr></thead>
          <tbody>${standingsRows}</tbody>
        </table>
      </div>

      ${renderPowerRankingsPanel(seasonData, draftData)}

      <div class="panel">
        <h2>Trade & Waiver History <span style="color:var(--sub);font-weight:400;font-size:11px;">(most recent first)</span></h2>
        <div class="scroll">
          <table>
            <thead><tr><th>Type</th><th>Week</th><th>Moves</th></tr></thead>
            <tbody>${txnRows || '<tr><td colspan="3" style="color:var(--sub);">No transactions yet</td></tr>'}</tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h2>Waiver Wire <span style="color:var(--sub);font-weight:400;font-size:11px;">(top 60 available, by Sleeper rank)</span></h2>
        <div class="scroll">
          <table>
            <thead><tr><th>Pos</th><th>Player</th><th>Team</th></tr></thead>
            <tbody>${waiverRows}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  // Starting lineups panel (always shown from shared draft-tracker data, independent of season sync)
  const rosterCards = draftData.teams.map(t=>{
    const L = computeLineup(t, draftData.players);
    const rows = L.slots.map(slot=>`
      <div class="rline"><span class="rlabel">${slot.label}</span>
        <span>${slot.player ? `<span class="postag ${slot.player.pos}">${slot.player.pos}</span>${slot.player.name}` : '<span style="color:var(--sub);font-style:italic;">empty</span>'}</span>
      </div>`).join("");
    return `<div class="rostercard">
      <h4>${t.name}</h4>
      ${rows}
      <div class="rline" style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px;">
        <span class="rlabel">Starter Pts</span><span style="color:var(--gold);font-weight:600;">${Math.round(L.starterTotal)}</span>
      </div>
    </div>`;
  }).join("");

  el.innerHTML += `
    <div class="panel">
      <h2>Starting Lineups <span style="color:var(--sub);font-weight:400;font-size:11px;">(as configured in the Draft Tracker)</span></h2>
      <div class="roster-grid">${rosterCards}</div>
    </div>
  `;

  const powerToggle = document.getElementById('powerToggleBtn');
  if(powerToggle) powerToggle.onclick = () => { powerDetailsShown = !powerDetailsShown; render(); };
}

document.getElementById('syncBtn').onclick = syncSeason;

document.getElementById('resetBtn').onclick = () => {
  const ok = confirm("This clears all cached standings, matchups, and transaction data for this browser (your draft tracker data is untouched). You'll need to sync again from scratch. Continue?");
  if(!ok) return;
  localStorage.removeItem(SEASON_CACHE_KEY);
  document.getElementById('syncStatus').textContent = "Cache cleared \u2014 click Sync from Sleeper to rebuild it.";
  render();
};

document.getElementById('previewBtn').onclick = () => {
  const draftData = loadDraftSharedData();
  if(!draftData || !draftData.teams.length){
    document.getElementById('syncStatus').textContent = "Load the Draft Tracker first so there are real teams to build a preview from.";
    return;
  }
  // Build believable-looking fake data using your REAL team names/nicknames, so the
  // preview looks like your actual league — but every number here is made up.
  const standings = draftData.teams.map((t,i)=>{
    const w = Math.floor(Math.random()*4);
    const l = 3 - w >= 0 ? 3 - w : 0;
    return {teamId:t.id, w, l, t:0, pf: Math.round(280 + Math.random()*140), name:t.name};
  });
  const sampleNames = draftData.teams.length>=2 ? [draftData.teams[0].name, draftData.teams[1].name] : ["Team A","Team B"];
  const transactions = [
    {type:"waiver", week:2, status_updated:Date.now()-86400000, rosterNames:[sampleNames[0]],
      adds:[{player:"(sample) Waiver Pickup", team:sampleNames[0]}], drops:[{player:"(sample) Bench Cut", team:sampleNames[0]}]},
    {type:"trade", week:1, status_updated:Date.now()-172800000, rosterNames:sampleNames,
      adds:[{player:"(sample) Player X", team:sampleNames[0]},{player:"(sample) Player Y", team:sampleNames[1]}],
      drops:[]},
    {type:"free_agent", week:3, status_updated:Date.now()-3600000, rosterNames:[sampleNames[1]||sampleNames[0]],
      adds:[{player:"(sample) FA Add", team:sampleNames[1]||sampleNames[0]}], drops:[]},
  ];
  const availablePlayers = [
    {id:"p1", name:"(sample) Available Player 1", pos:"RB", team:"---"},
    {id:"p2", name:"(sample) Available Player 2", pos:"WR", team:"---"},
    {id:"p3", name:"(sample) Available Player 3", pos:"TE", team:"---"},
  ];
  saveSeasonCache({
    currentWeek: 4,
    weekMatchups: {}, weekTransactions: {},
    standings, transactions, availablePlayers,
    isPreview: true,
    syncedAt: Date.now(),
  });
  document.getElementById('syncStatus').textContent = "Preview data loaded \u2014 remember to Reset before the real season.";
  render();
};

render();
syncSeason();
</script>
</body>
</html>
