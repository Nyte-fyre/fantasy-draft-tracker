<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2026 Season Tracker</title>
<style>
  :root{
    --bg:#0f1e17; --panel:#16281f; --panel2:#1c3226; --line:#2c4436;
    --gold:#d4af37; --gold-dim:#a8862c; --text:#eef2ee; --sub:#9fb3a6;
    --danger:#c65b4e; --accent:#4f9d78;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:1200px;margin:0 auto;padding:20px;}
  h1{font-size:22px;margin:0 0 4px;}
  h2{font-size:15px;margin:0 0 10px;color:var(--gold);}
  .sub{color:var(--sub);font-size:13px;margin-bottom:10px;}
  a{color:var(--gold);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:18px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;color:var(--sub);font-weight:500;padding:6px;border-bottom:1px solid var(--line);}
  tbody td{padding:6px;border-bottom:1px solid #223429;}
  tbody tr:hover{background:var(--panel2);}
  input[type=number],input[type=text],select{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 8px;font-size:13px;}
  button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:600;}
  button:hover{background:#3d8763;}
  .controls{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .empty-state{color:var(--sub);font-size:14px;text-align:center;padding:40px 20px;}
  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .rostercard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .rostercard h4{margin:0 0 8px;font-size:13px;color:var(--gold);}
  .rline{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #223429;}
  .rline:last-child{border-bottom:none;}
  .rlabel{color:var(--sub);font-weight:700;}
  .postag{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:600;margin-right:4px;}
  .QB{background:#4a2f6b;color:#dcc8ff;} .RB{background:#1d5c3f;color:#b8f0d4;}
  .WR{background:#1d4a6b;color:#bfe0ff;} .TE{background:#7a4a12;color:#ffd9a0;}
  .DST{background:#5c1f1f;color:#ffc4c4;} .K{background:#3d3d1a;color:#eef0b8;}
</style>
</head>
<body>
<div class="wrap">
  <h1>2026 Season Tracker</h1>
  <div class="sub">Standings, weekly scores, and each team's configured starting lineup &middot; shares data with the draft tracker automatically</div>
  <div style="margin-bottom:16px;"><a href="index.html">&larr; Back to Draft Tracker</a></div>

  <div id="content"></div>
</div>

<script>
const STORAGE_KEY = "ff-2026-draft-state";
const WEEKS_KEY = "ff-2026-season-weeks";
const LINEUP_SLOTS = [
  {key:"qbId",   label:"QB",   positions:["QB"]},
  {key:"rb1Id",  label:"RB",   positions:["RB"]},
  {key:"rb2Id",  label:"RB",   positions:["RB"]},
  {key:"wr1Id",  label:"WR",   positions:["WR"]},
  {key:"wr2Id",  label:"WR",   positions:["WR"]},
  {key:"teId",   label:"TE",   positions:["TE"]},
  {key:"flexId", label:"FLEX", positions:["RB","WR","TE"]},
  {key:"kId",    label:"K",    positions:["K"]},
  {key:"dstId",  label:"DST",  positions:["DST"]},
];

function loadDraftData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const state = JSON.parse(raw);
    // reconstruct a lightweight player list from the saved snapshot (name/pos/team/pts)
    const players = (state.pts||[]).map(p=>({name:p.name, pos:p.pos, team:p.team, pts:p.pts, ownerId:null}));
    const byName = {};
    players.forEach(p=>byName[p.name]=p);
    (state.owners||[]).forEach(o=>{ if(byName[o.name]) byName[o.name].ownerId = o.ownerId; });
    const teams = (state.teams||[]).map(t=>({...t}));
    return {players, teams};
  }catch(e){ return null; }
}

function computeLineup(team, players){
  const roster = players.filter(p=>p.ownerId===team.id);
  const usedNames = new Set();
  const slots = LINEUP_SLOTS.map(def=>{
    const pool = roster.filter(p=>def.positions.includes(p.pos) && !usedNames.has(p.name)).sort((a,b)=>b.pts-a.pts);
    let chosen = null;
    if(team[def.key]) chosen = pool.find(p=>p.name===team[def.key]) || null;
    if(!chosen) chosen = pool[0] || null;
    if(chosen) usedNames.add(chosen.name);
    return {...def, player:chosen};
  });
  const bench = roster.filter(p=>!usedNames.has(p.name));
  const starterTotal = slots.reduce((s,slot)=>s+(slot.player?slot.player.pts:0),0);
  return {slots, bench, starterTotal};
}

function loadWeeks(){
  try{ return JSON.parse(localStorage.getItem(WEEKS_KEY)) || {}; }catch(e){ return {}; }
}
function saveWeeks(weeks){
  try{ localStorage.setItem(WEEKS_KEY, JSON.stringify(weeks)); }catch(e){}
}

let currentWeek = 1;

function computeStandings(teams, weeks){
  return teams.map(t=>{
    let w=0,l=0,tt=0,pf=0;
    Object.values(weeks).forEach(weekData=>{
      const entry = weekData[t.id];
      if(!entry) return;
      pf += Number(entry.points)||0;
      if(entry.result==="W") w++;
      else if(entry.result==="L") l++;
      else if(entry.result==="T") tt++;
    });
    return {team:t, w, l, t:tt, pf};
  }).sort((a,b)=> b.w-a.w || b.pf-a.pf);
}

function render(){
  const data = loadDraftData();
  const el = document.getElementById('content');

  if(!data || !data.teams.length || !data.players.length){
    el.innerHTML = `<div class="panel"><div class="empty-state">
      No draft data found yet in this browser.<br>
      Open the <a href="index.html">Draft Tracker</a> first and sync/save your league, then come back here.
    </div></div>`;
    return;
  }

  const weeks = loadWeeks();
  const standings = computeStandings(data.teams, weeks);

  const standingsRows = standings.map((s,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${s.team.name}${s.team.nickname ? ` <span style="color:var(--sub);font-style:italic;font-size:11px;">"${s.team.nickname}"</span>` : ""}</td>
      <td>${s.w}-${s.l}${s.t?`-${s.t}`:""}</td>
      <td>${s.pf.toFixed(1)}</td>
    </tr>`).join("");

  const weekData = weeks[currentWeek] || {};
  const weekRows = data.teams.map(t=>{
    const entry = weekData[t.id] || {points:"", result:""};
    return `<tr>
      <td>${t.name}</td>
      <td><input type="number" step="0.1" class="weekPts" data-team="${t.id}" value="${entry.points}" style="width:80px;"></td>
      <td>
        <select class="weekResult" data-team="${t.id}">
          <option value="" ${!entry.result?'selected':''}>-</option>
          <option value="W" ${entry.result==='W'?'selected':''}>W</option>
          <option value="L" ${entry.result==='L'?'selected':''}>L</option>
          <option value="T" ${entry.result==='T'?'selected':''}>T</option>
        </select>
      </td>
    </tr>`;
  }).join("");

  const rosterCards = data.teams.map(t=>{
    const L = computeLineup(t, data.players);
    const rows = L.slots.map(slot=>`
      <div class="rline"><span class="rlabel">${slot.label}</span>
        <span>${slot.player ? `<span class="postag ${slot.player.pos}">${slot.player.pos}</span>${slot.player.name}` : '<span style="color:var(--sub);font-style:italic;">empty</span>'}</span>
      </div>`).join("");
    return `<div class="rostercard">
      <h4>${t.name}</h4>
      ${rows}
      <div class="rline" style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px;">
        <span class="rlabel">Starter Pts</span><span style="color:var(--gold);font-weight:600;">${Math.round(L.starterTotal)}</span>
      </div>
    </div>`;
  }).join("");

  el.innerHTML = `
    <div class="panel">
      <h2>Standings</h2>
      <table>
        <thead><tr><th>#</th><th>Team</th><th>Record</th><th>Points For</th></tr></thead>
        <tbody>${standingsRows}</tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Weekly Scores</h2>
      <div class="controls">
        <span>Week:</span>
        <input type="number" id="weekSelector" min="1" max="18" value="${currentWeek}" style="width:70px;">
        <button id="saveWeekBtn">Save Week</button>
      </div>
      <table>
        <thead><tr><th>Team</th><th>Points Scored</th><th>Result</th></tr></thead>
        <tbody>${weekRows}</tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Starting Lineups (as configured in the Draft Tracker)</h2>
      <div class="roster-grid">${rosterCards}</div>
    </div>
  `;

  document.getElementById('weekSelector').onchange = (e)=>{
    currentWeek = parseInt(e.target.value) || 1;
    render();
  };
  document.getElementById('saveWeekBtn').onclick = ()=>{
    const weeks = loadWeeks();
    const weekEntry = {};
    document.querySelectorAll('.weekPts').forEach(inp=>{
      const teamId = parseInt(inp.dataset.team);
      weekEntry[teamId] = weekEntry[teamId] || {};
      weekEntry[teamId].points = inp.value;
    });
    document.querySelectorAll('.weekResult').forEach(sel=>{
      const teamId = parseInt(sel.dataset.team);
      weekEntry[teamId] = weekEntry[teamId] || {};
      weekEntry[teamId].result = sel.value;
    });
    weeks[currentWeek] = weekEntry;
    saveWeeks(weeks);
    render();
  };
}

render();
</script>
</body>
</html>
