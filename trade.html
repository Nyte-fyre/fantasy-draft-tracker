<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%88%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1e17">
<title>Trade Analyzer</title>
<style>
  :root{
    --bg:#0f1e17; --panel:#16281f; --panel2:#1c3226; --line:#2c4436;
    --gold:#d4af37; --gold-dim:#a8862c; --text:#eef2ee; --sub:#9fb3a6;
    --danger:#c65b4e; --accent:#4f9d78;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:900px;margin:0 auto;padding:20px;}
  h1{font-size:22px;margin:0 0 4px;}
  h2{font-size:15px;margin:0 0 10px;color:var(--gold);}
  .sub{color:var(--sub);font-size:13px;margin-bottom:10px;}
  a{color:var(--gold);}
  .pagenav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .navpill{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    text-decoration:none;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;
    transition:border-color .15s,background .15s;}
  .navpill:hover{border-color:var(--gold-dim);}
  .navpill.active{background:var(--gold);color:#1a1a1a;border-color:var(--gold);cursor:default;pointer-events:none;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:18px;}
  input[type=text],select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px;width:100%;}
  button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:600;}
  button:hover{background:#3d8763;}
  button.remove{background:var(--danger);padding:2px 8px;font-size:11px;}
  .sides{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start;}
  .sidepanel{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .sidepanel h3{margin:0 0 10px;font-size:14px;color:var(--gold);}
  .vsdivider{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--sub);font-size:13px;padding-top:60px;}
  .playerrow{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);
    border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:13px;}
  .postag{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:600;margin-right:5px;}
  .QB{background:#4a2f6b;color:#dcc8ff;} .RB{background:#1d5c3f;color:#b8f0d4;}
  .WR{background:#1d4a6b;color:#bfe0ff;} .TE{background:#7a4a12;color:#ffd9a0;}
  .DST{background:#5c1f1f;color:#ffc4c4;} .K{background:#3d3d1a;color:#eef0b8;}
  .sidetotal{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;font-weight:700;color:var(--gold);text-align:right;}
  .verdict{text-align:center;font-size:15px;font-weight:600;padding:14px;background:var(--panel2);border-radius:10px;margin-top:14px;}
  .addrow{display:flex;gap:6px;margin-top:8px;}
  .empty-state{color:var(--sub);font-size:14px;text-align:center;padding:30px 20px;}
  .modetoggle{display:flex;gap:8px;}
  .modeBtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;}
  .modeBtn.active{background:var(--gold);color:#1a1a1a;border-color:var(--gold);}
  .suggestbox{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--gold-dim);
    border-radius:6px;margin-top:4px;max-height:220px;overflow-y:auto;z-index:10;}
  .suggestrow{padding:8px 10px;font-size:13px;cursor:pointer;}
  .suggestrow:hover{background:var(--panel2);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trade Analyzer</h1>
  <div class="sub">Compare two players head-to-head, or stack up a full trade &mdash; same tool either way</div>
  <div class="pagenav">
    <a href="index.html" class="navpill">Home</a>
    <a href="draft.html" class="navpill">Draft</a>
    <a href="season.html" class="navpill">Season</a>
    <a href="week.html" class="navpill">This Week</a>
    <a href="news.html" class="navpill">News</a>
    <a href="myteam.html" class="navpill">My Team</a>
    <a href="trade.html" class="navpill active">Trade Analyzer</a>
    <a href="rules.html" class="navpill">Rules</a>
    <a href="watchlist.html" class="navpill">Watchlist</a>
  </div>

  <div id="content"></div>
</div>

<script>
const DRAFT_STORAGE_KEY = "ff-2026-draft-state";
const VIEWER_KEY = "ff-2026-viewer-team"; // same "who am I" choice used across the site

function loadDraftSharedData(){
  try{
    const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
    if(!raw) return null;
    const state = JSON.parse(raw);
    const players = (state.pts||[]).map(p=>({name:p.name, pos:p.pos, team:p.team, pts:p.pts, adp:p.adp||999, ownerId:null}));
    const byName = {}; players.forEach(p=>byName[p.name]=p);
    (state.owners||[]).forEach(o=>{ if(byName[o.name]) byName[o.name].ownerId = o.ownerId; });
    const teams = (state.teams||[]).map(t=>({...t}));
    return {players, teams};
  }catch(e){ return null; }
}

let pool = [];
let teams = [];
let mode = "compare"; // "compare" or "trade"
let sideA = []; // array of player names
let sideB = [];

function playerByName(name){ return pool.find(p=>p.name===name); }
function sideTotal(side){ return side.reduce((s,name)=>{ const p=playerByName(name); return s+(p?p.pts:0); },0); }

function eligiblePool(sideLetter, myTeamId){
  if(mode==="compare") return pool;
  // trade mode: Side A can only be your own roster, Side B only players other teams currently own
  if(sideLetter==="A") return pool.filter(p=>p.ownerId===myTeamId);
  return pool.filter(p=>p.ownerId!=null && p.ownerId!==myTeamId);
}

function renderSide(sideLetter, names, myTeamId){
  const total = sideTotal(names);
  const rows = names.length
    ? names.map(name=>{
        const p = playerByName(name);
        if(!p) return "";
        return `<div class="playerrow">
          <span><span class="postag ${p.pos}">${p.pos}</span>${p.name} <span style="color:var(--sub);font-size:11px;">${p.team}</span></span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span style="color:var(--gold);">${p.pts}</span>
            <button class="remove" data-side="${sideLetter}" data-name="${p.name.replace(/"/g,'&quot;')}">x</button>
          </span>
        </div>`;
      }).join("")
    : `<div style="color:var(--sub);font-size:12px;font-style:italic;">No players added yet</div>`;

  const eligible = eligiblePool(sideLetter, myTeamId).filter(p=>!names.includes(p.name));

  return `<div class="sidepanel">
    <h3>Side ${sideLetter}${mode==="trade" ? (sideLetter==="A" ? " (your team)" : " (other teams)") : ""}</h3>
    ${rows}
    <div class="addrow" style="position:relative;">
      <input type="text" id="addInput${sideLetter}" placeholder="Type a player's name..." autocomplete="off">
      <div id="suggest${sideLetter}" class="suggestbox"></div>
    </div>
    <div class="sidetotal">${total.toFixed(0)} pts</div>
  </div>`;
}

function verdictText(totalA, totalB){
  const diff = totalA - totalB;
  const abs = Math.abs(diff);
  if(abs < 5) return "Roughly even value — this is a fair trade either way.";
  const winner = diff > 0 ? "Side A" : "Side B";
  return `${winner} comes out ahead by about ${abs.toFixed(0)} projected points.`;
}

function wireSearchInput(sideLetter, myTeamId){
  const input = document.getElementById('addInput'+sideLetter);
  const box = document.getElementById('suggest'+sideLetter);
  if(!input) return;

  function updateSuggestions(){
    const q = input.value.trim().toLowerCase();
    if(!q){ box.innerHTML = ""; box.style.display = "none"; return; }
    const side = sideLetter==="A" ? sideA : sideB;
    const matches = eligiblePool(sideLetter, myTeamId)
      .filter(p=>!side.includes(p.name) && p.name.toLowerCase().includes(q))
      .sort((a,b)=>a.adp-b.adp)
      .slice(0, 8);
    if(!matches.length){
      box.innerHTML = `<div class="suggestrow" style="color:var(--sub);font-style:italic;">No matches</div>`;
      box.style.display = "block";
      return;
    }
    box.innerHTML = matches.map(p=>
      `<div class="suggestrow" data-name="${p.name.replace(/"/g,'&quot;')}">
        <span class="postag ${p.pos}">${p.pos}</span>${p.name} <span style="color:var(--sub);font-size:11px;">${p.team}</span>
      </div>`
    ).join("");
    box.style.display = "block";
    box.querySelectorAll('.suggestrow').forEach(row=>{
      if(!row.dataset.name) return;
      row.onclick = () => {
        if(sideLetter==="A") sideA.push(row.dataset.name); else sideB.push(row.dataset.name);
        render();
      };
    });
  }

  input.oninput = updateSuggestions;
  input.onfocus = updateSuggestions;
  input.onblur = () => setTimeout(()=>{ box.style.display = "none"; }, 150); // delay so click still registers
}

function render(){
  const el = document.getElementById('content');
  const data = loadDraftSharedData();
  pool = data ? data.players : [];
  teams = data ? data.teams : [];

  if(!pool.length){
    el.innerHTML = `<div class="panel"><div class="empty-state">No player data found yet. Open the <a href="draft.html">Draft Tracker</a> first so there's a player pool to compare from.</div></div>`;
    return;
  }

  const myTeamId = parseInt(localStorage.getItem(VIEWER_KEY)) || null;
  const teamById = {}; teams.forEach(t=>teamById[t.id]=t);

  const modeToggle = `
    <div class="modetoggle">
      <button class="modeBtn ${mode==='compare'?'active':''}" data-mode="compare">Compare</button>
      <button class="modeBtn ${mode==='trade'?'active':''}" data-mode="trade">Trade</button>
    </div>`;

  if(mode==="trade" && !myTeamId){
    el.innerHTML = `
      <div class="panel">
        ${modeToggle}
        <div class="controls" style="margin-top:12px;">
          <span>Which team is yours?</span>
          <select id="teamPickSelect">
            <option value="">Select your team...</option>
            ${teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}
          </select>
        </div>
      </div>`;
    document.getElementById('teamPickSelect').onchange = (e)=>{
      if(e.target.value) localStorage.setItem(VIEWER_KEY, e.target.value);
      render();
    };
    document.querySelectorAll('.modeBtn').forEach(btn=>{
      btn.onclick = () => { mode = btn.dataset.mode; sideA=[]; sideB=[]; render(); };
    });
    return;
  }

  const totalA = sideTotal(sideA), totalB = sideTotal(sideB);

  el.innerHTML = `
    <div class="panel">
      ${modeToggle}
      ${mode==="trade" ? `<div class="sub" style="margin:10px 0 0;">Trading as <b style="color:var(--gold);">${teamById[myTeamId] ? teamById[myTeamId].name : "?"}</b></div>` : ""}
      <div class="sides" style="margin-top:14px;">
        ${renderSide("A", sideA, myTeamId)}
        <div class="vsdivider">VS</div>
        ${renderSide("B", sideB, myTeamId)}
      </div>
      ${(sideA.length && sideB.length) ? `<div class="verdict">${verdictText(totalA, totalB)}</div>` : ""}
    </div>
  `;

  wireSearchInput("A", myTeamId);
  wireSearchInput("B", myTeamId);

  document.querySelectorAll('.modeBtn').forEach(btn=>{
    btn.onclick = () => { mode = btn.dataset.mode; sideA=[]; sideB=[]; render(); };
  });

  el.querySelectorAll('.remove').forEach(btn=>{
    btn.onclick = () => {
      const side = btn.dataset.side, name = btn.dataset.name;
      if(side==="A") sideA = sideA.filter(n=>n!==name);
      else sideB = sideB.filter(n=>n!==name);
      render();
    };
  });
}

render();
</script>
</body>
</html>
